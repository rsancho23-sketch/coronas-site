<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja de Herramientas Ministerial — Coronas de Justicia</title>
<meta name="description" content="Test de dotación espiritual: descubre tus 40 dones bíblicos con certificado e informe pastoral. Gratuito.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0612; color: #f7f1e6; }
#root { min-height: 100vh; }
.cdj-back {
  position: fixed; top: 10px; left: 14px; z-index: 200;
  font-family: 'Manrope', sans-serif; font-size: 11px; letter-spacing: .12em;
  color: #c9a227; text-decoration: none; padding: 6px 12px;
  border: 1px solid rgba(201,162,39,.4); border-radius: 4px;
  background: rgba(10,6,18,.9); backdrop-filter: blur(6px);
}
#loading {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: #0a0612; z-index: 10; gap: 20px;
}
#loading .crown { font-size: 56px; animation: p 1.6s ease-in-out infinite; }
#loading p { font-family: 'Manrope', sans-serif; font-size: 12px;
  letter-spacing: .24em; color: #c9a227; text-transform: uppercase; }
@keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
</style>
</head>
<body>
<a href="index.html" class="cdj-back">← CoronasDeJusticia.com</a>
<div id="loading">
  <div class="crown">👑</div>
  <p>Cargando herramientas…</p>
</div>
<div id="root"></div>

<!-- React 18 (global window.React / window.ReactDOM) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Recharts (global window.Recharts) -->
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<!-- App precompilada: lucide-react bundleado dentro, react/recharts externos -->
<script src="app.js"></script>

<script>
var _t = setInterval(function() {
  if (document.getElementById('root').firstChild) {
    document.getElementById('loading').style.display = 'none';
    clearInterval(_t);
  }
}, 80);
setTimeout(function() {
  document.getElementById('loading').style.display = 'none';
}, 10000);
</script>
</body>
</html>
