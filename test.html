function CajaHerramientasV2() {
  const [lang, setLang] = useState('es');
  const [phase, setPhase] = useState('lang');
  const [nombre, setNombre] = useState('');
  const [iglesia, setIglesia] = useState('');
  const [fecha, setFecha] = useState('');
  const [quizIdx, setQuizIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [branchAns, setBranchAns] = useState({});
  const [rankOrder, setRankOrder] = useState(RANK_ITEMS.map(r => r.id));
  const [openIdx, setOpenIdx] = useState(0);
  const [openAns, setOpenAns] = useState(['', '', '', '']);
  const [leadership, setLeadership] = useState(null);
  const [maturityAns, setMaturityAns] = useState({});
  const [communityAns, setCommunityAns] = useState({});
  const [callingOrder, setCallingOrder] = useState(CALLING_ITEMS.map(c => c.id));
  const [toast, setToast] = useState(null);
  const [miles, setMiles] = useState({});
  const [earned, setEarned] = useState([]);
  const [result, setResult] = useState(null);
  const [apiFailed, setApiFailed] = useState(false);
  const [saved, setSaved] = useState(null);
  const [lv, setLv] = useState(0);
  const dragRef = useRef(null);
  const t = T[lang];

  const BRANCH_A_AT = 13;   // fin del eje A (índice 13)
  const BRANCH_B_AT = 28;   // fin del eje B (índice 28)
  const BRANCH_C_AT = 38;   // fin del eje C (índice 38)

  useEffect(() => {
    const l = document.createElement('link');
    l.href = 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap';
    l.rel = 'stylesheet'; document.head.appendChild(l);
    return () => { try { document.head.removeChild(l); } catch (e) {} };
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORAGE_KEY);
        if (r && r.value) { const s = JSON.parse(r.value); setSaved(s); if (s.lang) setLang(s.lang); setPhase('resume'); }
      } catch (e) {}
    })();
  }, []);

  useEffect(() => {
    if (phase !== 'analyzing') return;
    const i = setInterval(() => setLv(v => (v + 1) % LOADING_VERSES[lang].length), 3000);
    return () => clearInterval(i);
  }, [phase, lang]);

  const persist = useCallback(async (extra = {}) => {
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify({
        lang, nombre, iglesia, fecha, quizIdx, answers, branchAns, rankOrder,
        openIdx, openAns, leadership, maturityAns, communityAns, callingOrder,
        earned, result, phase, ...extra,
      }));
    } catch (e) {}
  }, [lang, nombre, iglesia, fecha, quizIdx, answers, branchAns, rankOrder, openIdx, openAns, leadership, maturityAns, communityAns, callingOrder, earned, result, phase]);

  const showToast = (m, ms = 2600) => { setToast(m); setTimeout(() => setToast(null), ms); };

  // ---- progreso ----
  const AFTER_OPEN = ['leadership', 'maturity', 'calling', 'analyzing', 'results'];
  const TOTAL = Q.length + 3 + 1 + 4 + 1 + 6 + 2 + 1;
  const rankDone = ['open', ...AFTER_OPEN].includes(phase) ? 1 : 0;
  const openDone = phase === 'open' ? openIdx : (AFTER_OPEN.includes(phase) ? 4 : 0);
  const leadershipDone = leadership ? 1 : (['maturity', 'calling', 'analyzing', 'results'].includes(phase) ? 1 : 0);
  const maturityDone = ['calling', 'analyzing', 'results'].includes(phase) ? 8 : (Object.keys(maturityAns).length + Object.keys(communityAns).length);
  const callingDone = ['analyzing', 'results'].includes(phase) ? 1 : 0;
  const done = Object.keys(answers).length + (branchAns.A ? 1 : 0) + (branchAns.B ? 1 : 0) + (branchAns.C ? 1 : 0)
    + rankDone + openDone + leadershipDone + maturityDone + callingDone;
  const progress = Math.min(100, Math.round((done / TOTAL) * 100));

  const topOfAxis = (ax) => {
    const acc = {};
    Q.forEach((q, i) => {
      if (q.a !== ax || !answers[i]) return;
      if (!acc[q.d]) acc[q.d] = { s: 0, c: 0 };
      acc[q.d].s += answers[i]; acc[q.d].c++;
    });
    let best = null, bv = -1;
    Object.entries(acc).forEach(([d, x]) => { const a = x.s / x.c; if (a > bv) { bv = a; best = d; } });
    return best;
  };

  const answerLikert = (val) => {
    const idx = quizIdx;
    const na = { ...answers, [idx]: val };
    setAnswers(na);
    if ((idx + 1) % 6 === 0) showToast(t.micro[Math.floor(Math.random() * t.micro.length)], 1300);
    const pct = Math.round((Object.keys(na).length / TOTAL) * 100);
    if (pct >= 75 && !miles.m75) { setMiles(p => ({ ...p, m75: true })); setEarned(p => [...p, t.badgePersev]); showToast(t.m75, 2700); }
    else if (pct >= 50 && !miles.m50) { setMiles(p => ({ ...p, m50: true })); setEarned(p => [...p, t.badgeConstant]); showToast(t.m50 + ' ' + t.m50verse, 4300); }
    else if (pct >= 25 && !miles.m25) { setMiles(p => ({ ...p, m25: true })); setEarned(p => [...p, t.badgeExplorer]); showToast(t.m25, 2500); }
    setTimeout(() => {
      if (idx === BRANCH_A_AT && !branchAns.A) { persist({ answers: na }); setPhase('branchA'); return; }
      if (idx === BRANCH_B_AT && !branchAns.B) { persist({ answers: na }); setPhase('branchB'); return; }
      if (idx === BRANCH_C_AT && !branchAns.C) { persist({ answers: na }); setPhase('branchC'); return; }
      if (idx === Q.length - 1) { persist({ answers: na }); setPhase('rank'); return; }
      setQuizIdx(idx + 1);
    }, 190);
  };

  const answerBranch = (which, don, opt) => {
    const nb = { ...branchAns, [which]: { don, opt } };
    setBranchAns(nb); persist({ branchAns: nb });
    setTimeout(() => { setQuizIdx(which === 'A' ? BRANCH_A_AT + 1 : which === 'B' ? BRANCH_B_AT + 1 : BRANCH_C_AT + 1); setPhase('quiz'); }, 200);
  };

  const moveRank = (id, dir) => setRankOrder(prev => {
    const a = [...prev]; const i = a.indexOf(id); const j = i + dir;
    if (j < 0 || j >= a.length) return prev;
    [a[i], a[j]] = [a[j], a[i]]; return a;
  });
  const onDrop = (target) => {
    const d = dragRef.current; if (!d || d === target) return;
    setRankOrder(prev => { const a = prev.filter(x => x !== d); a.splice(a.indexOf(target), 0, d); return a; });
    dragRef.current = null;
  };

  // ---- cálculo ----
  const computeScores = () => {
    const acc = {};
    Q.forEach((q, i) => {
      if (!acc[q.d]) acc[q.d] = { s: 0, c: 0 };
      acc[q.d].s += (answers[i] || 0); acc[q.d].c++;
    });
    const bonus = {};
    ['A', 'B', 'C'].forEach(w => { const b = branchAns[w]; if (b) bonus[b.don] = (bonus[b.don] || 0) + [0.3, 0.15, 0][b.opt]; });
    rankOrder.slice(0, 3).forEach((id, p) => {
      const it = RANK_ITEMS.find(r => r.id === id);
      if (it) bonus[it.don] = (bonus[it.don] || 0) + [0.35, 0.2, 0.1][p];
    });
    const out = {};
    Object.keys(LEX).forEach(k => {
      const x = acc[k] || { s: 0, c: 1 };
      const avg = Math.min(5, x.s / x.c + (bonus[k] || 0));
      out[k] = { ax: LEX[k].ax, avg: +avg.toFixed(2), pct: Math.round((avg / 5) * 100) };
    });
    return out;
  };

  const rankAxis = (sc, ax) => Object.entries(sc).filter(([, v]) => v.ax === ax)
    .sort((a, b) => b[1].pct - a[1].pct).map(([d, v]) => ({ don: d, pct: v.pct, avg: v.avg }));

  const buildTops = (sc) => {
    const A = rankAxis(sc, 'A'), B = rankAxis(sc, 'B'), C = rankAxis(sc, 'C'), D = rankAxis(sc, 'D'), E = rankAxis(sc, 'E');
    const all = [...A, ...B, ...C, ...D, ...E].sort((a, b) => b.pct - a.pct);
    return {
      A, B, C, D, E, all,
      topA: A.slice(0, 3), topB: B.slice(0, 3),
      primC: C[0] || null, secC: C[1] || null,
      topD: D.filter(x => x.avg >= 3.5).slice(0, 3).length ? D.filter(x => x.avg >= 3.5).slice(0, 3) : D.slice(0, 2),
      topE: E.filter(x => x.avg >= 3.5).slice(0, 3).length ? E.filter(x => x.avg >= 3.5).slice(0, 3) : E.slice(0, 2),
      deep: all.slice(0, 5),
    };
  };

  // ---- API (2 llamadas paralelas para más profundidad) ----
  const parseLoose = (raw) => {
    let s = String(raw || '').replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/g, '').trim();
    const a = s.indexOf('{');
    if (a > 0) s = s.slice(a);
    try { return JSON.parse(s); } catch (e) {}
    // recorte a la última llave balanceada (respuestas truncadas)
    let depth = 0, inStr = false, escp = false, last = -1;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (inStr) { if (escp) escp = false; else if (c === '\\') escp = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') inStr = true;
      else if (c === '{') depth++;
      else if (c === '}') { depth--; if (depth === 0) last = i; }
    }
    if (last > 0) { try { return JSON.parse(s.slice(0, last + 1)); } catch (e) {} }
    // cierre forzado de una respuesta cortada a mitad de string
    let fix = s;
    if (inStr) fix += '"';
    while (depth-- > 0) fix += '}';
    return JSON.parse(fix.replace(/,\s*([}\]])/g, '$1'));
  };

  const callClaude = async (system, payload, tries = 2) => {
    let lastErr = null;
    for (let i = 0; i < tries; i++) {
      try {
        const r = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system, messages: [{ role: 'user', content: JSON.stringify(payload) }] }),
        });
        const d = await r.json();
        const txt = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
        if (!txt) throw new Error('empty');
        return parseLoose(txt);
      } catch (e) { lastErr = e; await new Promise(res => setTimeout(res, 500 + i * 700)); }
    }
    throw lastErr;
  };

  const runAnalysis = async () => {
    setPhase('analyzing');
    const sc = computeScores();
    const tops = buildTops(sc);
    const L = { es: 'español', en: 'English', pt: 'português' }[lang];
    const nm = (k) => LEX[k].n[lang];

    const ldStyle = LEADERSHIP_STYLES.find(s => s.id === leadership) || LEADERSHIP_STYLES[0];
    const matVals = Object.values(maturityAns);
    const maturityPct = matVals.length ? Math.round((matVals.reduce((a, b) => a + b, 0) / matVals.length / 5) * 100) : null;
    const comVals = Object.values(communityAns);
    const communityPct = comVals.length ? Math.round((comVals.reduce((a, b) => a + b, 0) / comVals.length / 5) * 100) : null;
    const callingTop3 = callingOrder.slice(0, 3).map(id => CALLING_ITEMS.find(c => c.id === id)[lang]);

    const payload = {
      nombre, iglesia, fecha,
      dotaciones_principales: tops.deep.map(x => ({ don: nm(x.don), pct: x.pct, termino: LEX[x.don].term, texto: LEX[x.don].ref })),
      motivacion: tops.topA.map(x => ({ don: nm(x.don), pct: x.pct })),
      manifestacion: tops.topB.map(x => ({ don: nm(x.don), pct: x.pct })),
      ministerio_primario: tops.primC ? { don: nm(tops.primC.don), pct: tops.primC.pct } : null,
      ministerio_secundario: tops.secC ? { don: nm(tops.secC.don), pct: tops.secC.pct } : null,
      servicio: tops.topD.map(x => ({ don: nm(x.don), pct: x.pct })),
      creacionales: tops.topE.map(x => ({ don: nm(x.don), pct: x.pct })),
      mas_bajos: tops.all.slice(-4).map(x => ({ don: nm(x.don), pct: x.pct })),
      respuestas_abiertas: T[lang].openQs.map((q, i) => ({ pregunta: q, respuesta: openAns[i] })),
      estilo_liderazgo: ldStyle[lang],
      madurez_pct: maturityPct,
      confirmacion_comunitaria_pct: communityPct,
      enfoque_llamado_top3: callingTop3,
    };

    const first = (nombre || '').trim().split(' ')[0] || '';
    const J = 'Reply ONLY with strict JSON, no markdown fences, entirely in ' + L + '. Keys exactly: ';
    const tone = ' Everyday warm language, no dense theology. Never say the person is ONLY one thing.';

    // 5 llamadas cortas y paralelas (evita truncados) — cada una con retry
    const c1 = callClaude(
      `You are a warm, seasoned pastoral gifting counselor writing to the participant in second person. ${J}{"firma":"one memorable sentence naming this specific combination of gifts","combinacion":"ONE single flowing paragraph of 9-12 sentences, NO headings and NO lists: weave together their top gifts, their Ephesians-4 ministry, their leadership style (${ldStyle[lang]}) and their calling focus (${callingTop3.join(', ')}) into one living synergy — what this exact mixture produces that none of its parts produces alone, what it is NOT, and one vivid everyday image of this person operating at full capacity","corazon":"3-4 sentences synthesizing what moves their heart, drawn from their open answers, quoting nothing verbatim"}.${tone}`, payload);

    const c2 = callClaude(
      `You are a warm pastoral counselor writing to the participant in second person. ${J}{"liderazgo":"2-3 sentences on what their leadership style (${ldStyle[lang]}) looks like in daily practice given their gift mix","madurez":"3-4 sentences EXPLAINING what their maturity score (${maturityPct ?? 'n/a'}%) and community confirmation (${communityPct ?? 'n/a'}%) mean in plain words — what it says, what it does not say, and the single next step; encouraging if high, non-shaming and hopeful if low","llamado":"2-3 sentences on how their gifts play out specifically in ${callingTop3.join(', ')}","fortalezas":["3 specific strengths of this exact combination, one sentence each"],"riesgos":["2-3 POSSIBLE tendencies to watch, each phrased conditionally and lovingly (podria/en ocasiones/if unchecked), never as established facts — a superior may read this, so protect the person's dignity"]}.${tone}`, payload);

    const c3 = callClaude(
      `You are a warm pastoral counselor writing to the participant in second person. ${J}{"pasos":["4 concrete steps for THIS week, each naming a specific action tied to a specific gift of theirs, with a where and a when — not generic advice"],"ciego":"3-4 sentences on the main POSSIBLE blind spot of this gift combination, phrased as a loving warning of what COULD happen (podria/ten cuidado si), never as a diagnosis of what IS happening, ending with one corrective practice","epico":"ONE grand closing paragraph of 6-9 sentences, epic, biblical and poetic, second person, weaving their name (${first}), their badge identity, their gift mix and their hour in history — evocative of Scripture without inventing verses, majestic but not cheesy, ending with a charge to rise"}.${tone}`, payload);

    const c4 = callClaude(
      `You are writing a pastoral placement report ABOUT a church member for their pastor (third person, use the first name ${first}). ${J}{"resumen":"4-5 sentences: who this person is in gifting terms, what they bring to a local church, and the single most important thing the pastor should know","detalle":[{"don":"gift name exactly as given","significa":"2 sentences defining what this gift IS biblically, in general — do not mention this person here","practica":"2-3 sentences on how it shows up concretely in THIS person week to week, citing their specific data (their answers, their combination, their calling focus) — must NOT repeat significa","riesgo":"1-2 sentences on a POSSIBLE tendency to watch, phrased conditionally and kindly","activacion":"2 sentences with ONE specific, measurable assignment the pastor can give in the next 30 days (name the setting, the task and the frequency) — never generic advice like just serve more"}]}. Produce detalle for exactly the top 3 in dotaciones_principales. Concrete, no filler.`, payload);

    const c5 = callClaude(
      `You are writing the second half of a pastoral placement report ABOUT ${first} for their pastor (third person). ${J}{"ubicacion":["4 specific roles or teams in a local church where this person would thrive, each with a short reason"],"equipo":"3-4 sentences on why this person must not work alone and what balance they need","complemento":["3-4 profile types this person teams up best with — for each: the gift/temperament of the complement + WHY the pairing works + what each covers for the other; analyze deeply from their combination, e.g. a visionary needs an administrator"],"liderazgo_pastoral":"2-3 sentences advising the pastor how to develop someone with leadership style ${ldStyle[lang]}","madurez_obs":"2-3 sentences giving the pastor an honest, kind read on maturity (${maturityPct ?? 'n/a'}%) and community confirmation (${communityPct ?? 'n/a'}%), with one concrete next step to offer","enfoque_pastoral":"2-3 sentences on stewarding this person toward ${callingTop3.join(', ')}","devPlan":["3 concrete development actions for a 3-6 month growth plan"],"preguntas":["4 specific questions for the one-on-one"]}. Concrete, no filler.`, payload);

    const [r1, r2, r3, r4, r5] = await Promise.allSettled([c1, c2, c3, c4, c5]);
    const v = (r) => r.status === 'fulfilled' ? r.value : null;
    const p1 = v(r1), p2 = v(r2), p3 = v(r3), p4 = v(r4), p5 = v(r5);
    const failedCount = [p1, p2, p3, p4, p5].filter(x => !x).length;

    const primDon = tops.primC ? tops.primC.don : 'pastorM';
    const badgeName = (BADGES[primDon] || BADGES.pastorM)[lang];
    const verseTxt = (VERSES[primDon] || VERSES.pastorM)[lang];
    const matBand = maturityPct == null ? '' : (maturityPct < 50 ? t.matLow : maturityPct < 75 ? t.matMid : t.matHigh);

    const personal = {
      firma: (p1 && p1.firma) || (lang === 'es' ? `${first}, Dios combinó en ti ${nm(tops.deep[0].don)} y ${nm(tops.deep[1].don)} para esta hora.` : lang === 'en' ? `${first}, God combined ${nm(tops.deep[0].don)} and ${nm(tops.deep[1].don)} in you for this hour.` : `${first}, Deus combinou em você ${nm(tops.deep[0].don)} e ${nm(tops.deep[1].don)} para esta hora.`),
      combinacion: (p1 && p1.combinacion) || tops.deep.slice(0, 3).map(x => `${nm(x.don)}: ${LEX[x.don].d[lang]}`).join(' '),
      corazon: (p1 && p1.corazon) || openAns[3] || openAns[0] || '',
      liderazgo: (p2 && p2.liderazgo) || ldStyle.d[lang],
      madurez: ((p2 && p2.madurez) || '') || matBand,
      llamado: (p2 && p2.llamado) || '',
      fortalezas: (p2 && p2.fortalezas) || tops.deep.slice(0, 3).map(x => nm(x.don)),
      riesgos: (p2 && p2.riesgos) || tops.deep.slice(0, 2).map(x => LEX[x.don].s[lang]),
      pasos: (p3 && p3.pasos) || FALLBACK_STEPS[lang],
      ciego: (p3 && p3.ciego) || LEX[primDon].s[lang],
      epico: (p3 && p3.epico) || EPIC_FALLBACK[lang](first, badgeName, `${verseTxt.v} (${verseTxt.r}).`),
      matBand,
    };
    const pastor = {
      resumen: (p4 && p4.resumen) || tops.deep.slice(0, 3).map(x => `${nm(x.don)} (${x.pct}%): ${LEX[x.don].d[lang]}`).join(' '),
      detalle: (p4 && p4.detalle) || tops.deep.slice(0, 3).map(x => ({ don: nm(x.don), significa: LEX[x.don].d[lang], practica: '', riesgo: LEX[x.don].s[lang], activacion: FALLBACK_STEPS[lang][1] })),
      ubicacion: (p5 && p5.ubicacion) || [],
      equipo: (p5 && p5.equipo) || '',
      complemento: (p5 && p5.complemento) || (COMPLEMENT_MAP[primDon] || []).map(k => `${LEX[k].n[lang]} — ${LEX[k].d[lang]}`),
      liderazgo_pastoral: (p5 && p5.liderazgo_pastoral) || '',
      madurez_obs: (p5 && p5.madurez_obs) || matBand,
      enfoque_pastoral: (p5 && p5.enfoque_pastoral) || '',
      devPlan: (p5 && p5.devPlan) || FALLBACK_STEPS[lang],
      preguntas: (p5 && p5.preguntas) || [],
    };
    personal.bendicion = BLESSING[lang];
    setApiFailed(failedCount >= 4);

    const fin = { tops, sc, personal, pastor, extra: { leadership: ldStyle, maturityPct, communityPct, callingTop3 } };
    setResult(fin);
    const ne = earned.includes(t.badgeFinal) ? earned : [...earned, t.badgeFinal];
    setEarned(ne);
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify({
        lang, nombre, iglesia, fecha, quizIdx: Q.length - 1, answers, branchAns, rankOrder,
        openIdx: 3, openAns, leadership, maturityAns, communityAns, callingOrder,
        earned: ne, result: fin, phase: 'results',
      }));
    } catch (e) {}
    setPhase('results');
  };

  // ---- sesión guardada ----
  const doResumeSeen = () => {
    const s = saved; if (!s || !s.result) { setPhase('welcome'); return; }
    setNombre(s.nombre); setIglesia(s.iglesia); setFecha(s.fecha);
    setAnswers(s.answers || {}); setBranchAns(s.branchAns || {});
    setRankOrder(s.rankOrder || RANK_ITEMS.map(r => r.id));
    setOpenAns(s.openAns || ['', '', '', '']);
    setLeadership(s.leadership || null); setMaturityAns(s.maturityAns || {}); setCommunityAns(s.communityAns || {});
    setCallingOrder(s.callingOrder || CALLING_ITEMS.map(c => c.id));
    setEarned(s.earned || []);
    setResult(s.result); setPhase('results');
  };
  const doResumeContinue = () => {
    const s = saved; if (!s) { setPhase('welcome'); return; }
    setNombre(s.nombre || ''); setIglesia(s.iglesia || ''); setFecha(s.fecha || '');
    setAnswers(s.answers || {}); setBranchAns(s.branchAns || {});
    setRankOrder(s.rankOrder || RANK_ITEMS.map(r => r.id));
    setOpenIdx(s.openIdx || 0); setOpenAns(s.openAns || ['', '', '', '']);
    setLeadership(s.leadership || null); setMaturityAns(s.maturityAns || {}); setCommunityAns(s.communityAns || {});
    setCallingOrder(s.callingOrder || CALLING_ITEMS.map(c => c.id));
    setEarned(s.earned || []);
    if (!s.nombre) { setPhase('register'); return; }
    const n = Object.keys(s.answers || {}).length;
    if (n < Q.length) { setQuizIdx(Math.min(n, Q.length - 1)); setPhase('quiz'); return; }
    const chain = ['rank', 'open', 'leadership', 'maturity', 'calling'];
    setPhase(chain.includes(s.phase) ? s.phase : 'rank');
  };
  const restartAll = async () => {
    try { await window.storage.delete(STORAGE_KEY); } catch (e) {}
    setNombre(''); setIglesia(''); setFecha(''); setQuizIdx(0); setAnswers({}); setBranchAns({});
    setRankOrder(RANK_ITEMS.map(r => r.id)); setOpenIdx(0); setOpenAns(['', '', '', '']);
    setLeadership(null); setMaturityAns({}); setCommunityAns({}); setCallingOrder(CALLING_ITEMS.map(c => c.id));
    setEarned([]); setMiles({}); setResult(null); setApiFailed(false); setPhase('welcome');
  };

  const share = async () => {
    const url = (typeof window !== 'undefined' && window.location) ? window.location.href : '';
    try {
      if (navigator.share) { await navigator.share({ title: t.appName, text: t.shareText, url }); return; }
      await navigator.clipboard.writeText(`${t.shareText} ${url}`); showToast(t.shareCopied, 3200);
    } catch (e) {
      try { await navigator.clipboard.writeText(`${t.shareText} ${url}`); showToast(t.shareCopied, 3200); } catch (e2) {}
    }
  };

  // ---- PDF: pestaña nueva con auto-print (funciona en Chrome) + descarga de respaldo ----
  const openPdf = () => {
    try {
      const html = buildReportHTML({ t, lang, nombre, iglesia, fecha, result, earned, autoPrint: true });
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const w = window.open(url, '_blank');
      if (!w) { showToast(t.pdfPopup, 5000); downloadPdfFile(); return; }
      showToast(t.pdfOpened, 2200);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { showToast(t.pdfBlocked, 4200); }
  };
  const downloadPdfFile = () => {
    try {
      const html = buildReportHTML({ t, lang, nombre, iglesia, fecha, result, earned, autoPrint: false });
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const safe = (nombre || 'participante').replace(/[^\w\sÀ-ÿ-]/g, '').trim().replace(/\s+/g, '_');
      a.href = url; a.download = `CoronasDeJusticia_${safe}.html`;
      a.rel = 'noopener'; a.target = '_self';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
      showToast(t.dlDone, 4200);
    } catch (e) { showToast(t.pdfBlocked, 4200); }
  };

  // ---- Infografía resumen (imagen PNG descargable) ----
  const downloadInfographic = () => {
    try {
      const { tops, personal } = result;
      const prim = tops.primC || { don: 'pastorM', pct: 0 };
      const badgeName = (BADGES[prim.don] || BADGES.pastorM)[lang];
      const verse = (VERSES[prim.don] || VERSES.pastorM)[lang];
      const nmL = k => LEX[k].n[lang];
      const c = document.createElement('canvas');
      c.width = 1080; c.height = 1350;
      const x = c.getContext('2d');
      // fondo
      const g = x.createLinearGradient(0, 0, 0, 1350);
      g.addColorStop(0, '#160d26'); g.addColorStop(1, '#06030c');
      x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
      // marco
      x.strokeStyle = '#d4a857'; x.lineWidth = 4; x.strokeRect(36, 36, 1008, 1278);
      x.strokeStyle = 'rgba(212,168,87,.4)'; x.lineWidth = 1; x.strokeRect(50, 50, 980, 1250);
      const center = (txt, y, font, color, maxW) => {
        x.font = font; x.fillStyle = color; x.textAlign = 'center';
        x.fillText(txt, 540, y, maxW || 940);
      };
      const wrap = (txt, y0, font, color, maxW, lh) => {
        x.font = font; x.fillStyle = color; x.textAlign = 'center';
        const words = String(txt).split(' '); let line = '', y = y0;
        words.forEach(w2 => {
          const test = line ? line + ' ' + w2 : w2;
          if (x.measureText(test).width > maxW) { x.fillText(line, 540, y, maxW); line = w2; y += lh; }
          else line = test;
        });
        if (line) x.fillText(line, 540, y, maxW); return y;
      };
      center('✦ CORONAS DE JUSTICIA ✦', 120, '600 30px Georgia, serif', '#d4a857');
      center(t.appName.toUpperCase(), 158, '20px sans-serif', '#a68b3d');
      center(nombre, 250, 'italic 64px Georgia, serif', '#f7f1e6', 960);
      center(`${iglesia} · ${fecha}`, 298, '24px sans-serif', '#c3b8a4', 940);
      // insignia
      x.beginPath(); x.arc(540, 430, 92, 0, 6.2832);
      const g2 = x.createLinearGradient(448, 338, 632, 522);
      g2.addColorStop(0, '#d4a857'); g2.addColorStop(1, '#f2cd85');
      x.fillStyle = g2; x.fill();
      center('✦', 458, '84px serif', '#0a0612');
      center(badgeName, 590, '600 44px Georgia, serif', '#f2cd85', 940);
      center(`${nmL(prim.don)} · ${prim.pct}%`, 632, '24px sans-serif', '#c3b8a4');
      // top 3 dones
      let y = 720;
      x.textAlign = 'left';
      tops.deep.slice(0, 3).forEach((d2, i2) => {
        x.font = '600 27px sans-serif'; x.fillStyle = '#f7f1e6';
        x.fillText(`${i2 + 1}. ${nmL(d2.don)}`, 140, y);
        x.font = '27px sans-serif'; x.fillStyle = '#d4a857'; x.textAlign = 'right';
        x.fillText(`${d2.pct}%`, 940, y);
        x.textAlign = 'left';
        x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(140, y + 14, 800, 8);
        x.fillStyle = '#d4a857'; x.fillRect(140, y + 14, 800 * d2.pct / 100, 8);
        y += 74;
      });
      // firma
      const yF = wrap(`"${personal.firma}"`, y + 42, 'italic 30px Georgia, serif', '#f2cd85', 860, 42);
      // versículo
      const yV = wrap(verse.v, yF + 76, 'italic 28px Georgia, serif', '#f7f1e6', 840, 40);
      center(`— ${verse.r}`, yV + 42, '22px sans-serif', '#c3b8a4');
      center(t.printFooter, 1272, '18px sans-serif', 'rgba(166,139,61,.8)');
      c.toBlob(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const safe = (nombre || 'participante').replace(/[^\w\sÀ-ÿ-]/g, '').trim().replace(/\s+/g, '_');
        a.href = url; a.download = `CoronasDeJusticia_${safe}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 8000);
        showToast(t.imgDone, 3600);
      }, 'image/png');
    } catch (e) {}
  };

  const startRegister = () => {
    const loc = { es: 'es-CR', en: 'en-US', pt: 'pt-BR' }[lang];
    setFecha(new Date().toLocaleDateString(loc, { day: '2-digit', month: '2-digit', year: 'numeric' }));
    setPhase('register');
  };

  // ================= RENDER =================
  const axisMeta = { A: [t.axisA, t.axisAsub], B: [t.axisB, t.axisBsub], C: [t.axisC, t.axisCsub], D: [t.axisD, t.axisDsub], E: [t.axisE, t.axisEsub] };

  return (
    <div style={{
      minHeight: '100vh', background: P.bg, color: P.ink,
      fontFamily: '"Manrope", sans-serif', padding: '20px 14px 60px',
      position: 'relative', overflowX: 'hidden',
    }}>
      <GlobalStyles />
      <Backdrop />
      {phase === 'results' && <Confetti />}

      <div style={{ maxWidth: 720, margin: '0 auto', position: 'relative', zIndex: 5 }}>
        {['quiz', 'branchA', 'branchB', 'branchC', 'rank', 'open', 'leadership', 'maturity', 'calling'].includes(phase) && (
          <div style={{ marginBottom: 18, background: P.bg, padding: '8px 0', borderRadius: 6 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, color: P.inkDim, letterSpacing: '0.16em', marginBottom: 6, fontWeight: 600 }}>
              <span>{t.appName.toUpperCase()}</span>
              <span style={{ color: P.goldBright, fontWeight: 800 }}>{progress}%</span>
            </div>
            <div style={{ height: 5, background: 'rgba(255,255,255,0.08)', borderRadius: 4, overflow: 'hidden' }}>
              <div style={{
                height: '100%', width: `${progress}%`, borderRadius: 4,
                background: `linear-gradient(90deg, ${P.gold}, ${P.goldBright}, ${P.gold})`,
                backgroundSize: '200% 100%', animation: 'shimmer 2.5s linear infinite',
                transition: 'width .5s cubic-bezier(.4,0,.2,1)',
              }} />
            </div>
          </div>
        )}

        {phase === 'lang' && <LangScreen lang={lang} setLang={setLang} onNext={() => setPhase(saved ? 'resume' : 'welcome')} />}
        {phase === 'resume' && <ResumeScreen t={t} saved={saved} onSeen={doResumeSeen} onContinue={doResumeContinue} onRestart={restartAll} />}
        {phase === 'welcome' && <WelcomeScreen t={t} onStart={startRegister} />}
        {phase === 'register' && <RegisterScreen t={t} nombre={nombre} setNombre={setNombre} iglesia={iglesia} setIglesia={setIglesia} fecha={fecha} onGo={() => { persist(); setPhase('quiz'); }} />}
        {phase === 'quiz' && <QuizScreen t={t} lang={lang} idx={quizIdx} q={Q[quizIdx]} meta={axisMeta[Q[quizIdx].a]} current={answers[quizIdx]} onAnswer={answerLikert} onBack={() => quizIdx > 0 && setQuizIdx(quizIdx - 1)} />}
        {phase === 'branchA' && <BranchScreen t={t} lang={lang} bank={BRANCH_A} topDon={topOfAxis('A') || 'profecia'} onAnswer={(d, i) => answerBranch('A', d, i)} />}
        {phase === 'branchB' && <BranchScreen t={t} lang={lang} bank={BRANCH_B} topDon={topOfAxis('B') || 'sabiduria'} onAnswer={(d, i) => answerBranch('B', d, i)} />}
        {phase === 'branchC' && <BranchScreen t={t} lang={lang} bank={BRANCH_C} topDon={topOfAxis('C') || 'pastorM'} onAnswer={(d, i) => answerBranch('C', d, i)} />}
        {phase === 'rank' && <RankScreen t={t} lang={lang} order={rankOrder} onDragStart={id => { dragRef.current = id; }} onDropOn={onDrop} onMove={moveRank} onConfirm={() => { persist(); setPhase('open'); }} />}
        {phase === 'open' && <OpenScreen t={t} idx={openIdx} value={openAns[openIdx]}
          onChange={v => { const a = [...openAns]; a[openIdx] = v; setOpenAns(a); }}
          onBack={() => openIdx > 0 ? setOpenIdx(openIdx - 1) : setPhase('rank')}
          onNext={() => { persist(); openIdx < 3 ? setOpenIdx(openIdx + 1) : setPhase('leadership'); }}
          isLast={openIdx === 3} />}
        {phase === 'leadership' && <LeadershipScreen t={t} lang={lang} value={leadership} onSelect={id => { setLeadership(id); persist({ leadership: id }); setTimeout(() => setPhase('maturity'), 200); }} />}
        {phase === 'maturity' && <MaturityScreen t={t} lang={lang} maturityAns={maturityAns} communityAns={communityAns}
          onMaturity={(i, v) => { const a = { ...maturityAns, [i]: v }; setMaturityAns(a); persist({ maturityAns: a }); }}
          onCommunity={(i, v) => { const a = { ...communityAns, [i]: v }; setCommunityAns(a); persist({ communityAns: a }); }}
          onBack={() => setPhase('leadership')}
          onNext={() => { persist(); setPhase('calling'); }} />}
        {phase === 'calling' && <RankScreen t={t} lang={lang} order={callingOrder} items={CALLING_ITEMS}
          title={t.callingTitle} hint={t.callingHint} confirmLabel={t.finish}
          onDragStart={id => { dragRef.current = id; }}
          onDropOn={target => { const d = dragRef.current; if (!d || d === target) return; setCallingOrder(prev => { const a = prev.filter(x => x !== d); a.splice(a.indexOf(target), 0, d); return a; }); dragRef.current = null; }}
          onMove={(id, dir) => setCallingOrder(prev => { const a = [...prev]; const i = a.indexOf(id); const j = i + dir; if (j < 0 || j >= a.length) return prev; [a[i], a[j]] = [a[j], a[i]]; return a; })}
          onConfirm={() => { persist(); runAnalysis(); }} />}
        {phase === 'analyzing' && <AnalyzingScreen t={t} verse={LOADING_VERSES[lang][lv]} />}

function GiftRadar({ data }) {
  const box = useRef(null);
  const [w, setW] = useState(0);
  useEffect(() => {
    const measure = () => { if (box.current) setW(box.current.offsetWidth); };
    measure();
    const id = setTimeout(measure, 120);
    window.addEventListener('resize', measure);
    return () => { clearTimeout(id); window.removeEventListener('resize', measure); };
  }, []);
  const h = 320;
  return (
    <div ref={box} style={{ width: '100%', minHeight: h }}>
      {w > 40 && (
        <div style={{ perspective: 1100 }}>
          <div style={{ animation: 'tilt3d 1.3s cubic-bezier(.2,.8,.2,1) forwards', transformOrigin: '50% 60%' }}>
            <RadarChart width={w} height={h} data={data} outerRadius="72%" margin={{ top: 12, right: 30, bottom: 12, left: 30 }}>
              <PolarGrid stroke="rgba(212,168,87,0.28)" />
              <PolarAngleAxis dataKey="k" tick={{ fill: P.ink, fontSize: 10.5, fontFamily: 'Manrope' }} />
              <PolarRadiusAxis domain={[0, 100]} tick={false} axisLine={false} />
              <Radar dataKey="v" stroke={P.goldBright} fill={P.gold} fillOpacity={0.36} strokeWidth={2} isAnimationActive animationDuration={1300} />
            </RadarChart>
          </div>
        </div>
      )}
    </div>
  );
}

  const axisBlocks = [
    { key: 'A', title: t.topMotiv, rows: tops.A },
    { key: 'B', title: t.topManif, rows: tops.B },
    { key: 'D', title: t.serviceGifts, rows: tops.D },
    { key: 'E', title: t.creational, rows: tops.E },
  ];

  return (
    <div style={{ paddingTop: 14, animation: 'fadeIn .8s ease' }}>
      {apiFailed && (
        <div style={{ padding: '10px 14px', background: P.panel, border: `1px solid ${P.crimson}66`, borderRadius: 8, fontSize: 12, color: P.inkDim, marginBottom: 16 }}>{t.apiFail}</div>
      )}

      <div style={{ textAlign: 'center', marginBottom: 26 }}>
        <div style={{ fontSize: 10.5, color: P.goldBright, letterSpacing: '0.3em', textTransform: 'uppercase', marginBottom: 10, fontWeight: 700 }}>✦ {t.resultsFor} ✦</div>
        <h1 style={H(40)}>{nombre}</h1>
        <p style={{ fontSize: 13, color: P.inkDim, margin: '8px 0 0' }}>
          {t.church}: <span style={{ color: P.ink }}>{iglesia}</span> · {t.date}: <span style={{ color: P.ink }}>{fecha}</span>
        </p>
      </div>

      {/* Insignia */}
      <div style={{ textAlign: 'center', padding: '26px 20px', marginBottom: 18, background: P.panel, border: `1px solid ${P.gold}55`, borderRadius: 12 }}>
        <div style={{ fontSize: 10.5, color: P.goldBright, letterSpacing: '0.24em', textTransform: 'uppercase', marginBottom: 16, fontWeight: 700 }}>{t.yourBadge}</div>
        <div style={{
          width: 90, height: 90, margin: '0 auto 14px', borderRadius: '50%',
          background: `linear-gradient(135deg, ${P.gold}, ${P.goldBright})`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: `0 0 38px -8px ${P.gold}`, animation: 'float 3.5s ease-in-out infinite',
        }}><BIcon size={42} style={{ color: P.bgDeep }} /></div>
        <h2 style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 30, fontWeight: 500, color: P.goldBright, margin: '0 0 8px' }}>{badge[lang]}</h2>
        {personal.firma && <p style={{ fontFamily: 'Cormorant Garamond, serif', fontStyle: 'italic', fontSize: 18, color: P.ink, maxWidth: 480, margin: '10px auto 0', lineHeight: 1.45 }}>"{personal.firma}"</p>}
      </div>

      {radar.length >= 3 && <Card title={t.signature}><GiftRadar data={radar} /></Card>}

      {/* Combinación única */}
      {personal.combinacion && (
        <Card title={t.combo} sub={t.comboSub} icon={Layers}>
          <p style={{ fontSize: 14.5, lineHeight: 1.68, margin: 0, color: P.ink }}>{personal.combinacion}</p>
        </Card>
      )}

      {/* Ministerio Ef 4 — ranking completo */}
      <Card title={t.ministry} sub={t.ministryRank} icon={Target}>
        {prim && (
          <div style={{ padding: '16px 18px', marginBottom: 10, borderRadius: 8, background: P.panelSoft, border: `1px solid ${P.gold}66` }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
              <div>
                <div style={{ fontSize: 9.5, color: P.goldBright, letterSpacing: '0.2em', textTransform: 'uppercase', fontWeight: 700 }}>{t.primary}</div>
                <div style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 27, color: P.goldBright, fontWeight: 500 }}>{nm(prim.don)}</div>
              </div>
              <div style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 23, color: P.gold }}>{prim.pct}%</div>
            </div>
            <div style={{ fontSize: 11.5, color: P.inkFaint, marginBottom: 6 }}>{LEX[prim.don].term} · {LEX[prim.don].ref}</div>
            <p style={{ fontSize: 13.5, color: P.inkDim, margin: 0, lineHeight: 1.55 }}>{LEX[prim.don].d[lang]}</p>
          </div>
        )}
        {tops.C.slice(1).map((x, i) => (
          <Bar key={x.don} rank={i + 2} name={nm(x.don)} sub={i === 0 ? `${t.secondary} · ${LEX[x.don].ref}` : LEX[x.don].ref} pct={x.pct} delay={i * 0.09} />
        ))}
      </Card>

      {/* Liderazgo */}
      {extra.leadership && (
        <Card title={t.leadership} icon={Compass}>
          <div style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 23, color: P.goldBright, marginBottom: 8 }}>{extra.leadership[lang]}</div>
          <p style={{ fontSize: 13.5, lineHeight: 1.62, margin: 0, color: P.ink }}>{personal.liderazgo || extra.leadership.d[lang]}</p>
        </Card>
      )}

      {/* Madurez y fruto + confirmación comunitaria */}
      {(extra.maturityPct != null || extra.communityPct != null) && (
        <Card title={t.maturity} sub={t.fruit}>
          {extra.maturityPct != null && <Metric label={t.maturity} pct={extra.maturityPct} />}
          {extra.communityPct != null && <Metric label={t.community} pct={extra.communityPct} />}
          {personal.madurez && <p style={{ fontSize: 13.5, lineHeight: 1.62, margin: '10px 0 0', color: P.ink }}>{personal.madurez}</p>}
          {personal.matBand && personal.madurez !== personal.matBand && (
            <p style={{ fontSize: 12.5, lineHeight: 1.6, margin: '10px 0 0', color: P.inkDim, fontStyle: 'italic' }}>{personal.matBand}</p>
          )}
        </Card>
      )}

      {/* Enfoque del llamado */}
      {extra.callingTop3 && extra.callingTop3.length > 0 && (
        <Card title={t.calling} icon={Globe}>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: personal.llamado ? 12 : 0 }}>
            {extra.callingTop3.map((c, i) => (
              <span key={i} style={{ padding: '6px 13px', background: P.panelSoft, border: `1px solid ${P.gold}55`, borderRadius: 999, fontSize: 12.5, color: P.goldBright }}>{i + 1}. {c}</span>
            ))}
          </div>
          {personal.llamado && <p style={{ fontSize: 13.5, lineHeight: 1.62, margin: 0, color: P.ink }}>{personal.llamado}</p>}
        </Card>
      )}

      {/* Fortalezas y riesgos */}
      {((personal.fortalezas || []).length > 0 || (personal.riesgos || []).length > 0) && (
        <Card title={t.strengths} sub={t.risks}>
          {(personal.fortalezas || []).length > 0 && (
            <ul style={{ margin: '0 0 12px', paddingLeft: 18, fontSize: 13.5, lineHeight: 1.6, color: P.ink }}>
              {personal.fortalezas.map((f, i) => <li key={i} style={{ marginBottom: 4 }}>{f}</li>)}
            </ul>
          )}
          {(personal.riesgos || []).length > 0 && (
            <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, lineHeight: 1.6, color: '#e8a394' }}>
              {personal.riesgos.map((r, i) => <li key={i} style={{ marginBottom: 4 }}>{r}</li>)}
            </ul>
          )}
        </Card>
      )}

      {/* Con quién haces mejor equipo */}
      {(((pastor.complemento || []).length > 0) || pastor.equipo) && (
        <Card title={t.complementTitle} sub={t.complementSub} icon={Users}>
          {pastor.equipo && <p style={{ fontSize: 13.5, lineHeight: 1.62, margin: '0 0 12px', color: P.ink }}>{pastor.equipo}</p>}
          {(pastor.complemento || []).map((cp, i) => (
            <div key={i} style={{ display: 'flex', gap: 11, padding: '10px 0', borderTop: i ? `1px solid ${P.borderSoft}` : 'none' }}>
              <span style={{ fontSize: 16, flexShrink: 0 }}>🤝</span>
              <p style={{ fontSize: 13.5, lineHeight: 1.58, margin: 0, color: P.ink }}>{cp}</p>
            </div>
          ))}
        </Card>
      )}

      {/* Dotaciones al detalle */}
      {pastor.detalle && pastor.detalle.length > 0 && (
        <Card title={t.deepTitle} sub={t.deepSub} icon={BookOpen}>
          {tops.deep.slice(0, 3).map((x, i) => {
            const det = pastor.detalle[i] || {};
            const lx = LEX[x.don];
            return (
              <div key={x.don} style={{ padding: '16px 0', borderTop: i ? `1px solid ${P.borderSoft}` : 'none' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 3 }}>
                  <span style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 22, color: P.goldBright }}>{nm(x.don)}</span>
                  <span style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 18, color: P.gold }}>{x.pct}%</span>
                </div>
                <div style={{ fontSize: 11.5, color: P.inkFaint, marginBottom: 10 }}>{lx.term} · {lx.ref}</div>
                <Line label={t.whatIs} text={det.significa || lx.d[lang]} />
                <Line label={t.howLooks} text={det.practica || lx.d[lang]} />
                <Line label={t.shadow} text={det.riesgo || lx.s[lang]} warn />
                {det.activacion && <Line label={t.activate} text={det.activacion} gold />}
              </div>
            );
          })}
        </Card>
      )}

      {/* Bloques por eje */}
      {axisBlocks.map(b => (
        <Card key={b.key} title={b.title}>
          {b.rows.slice(0, 5).map((x, i) => <Bar key={x.don} rank={i + 1} name={nm(x.don)} sub={LEX[x.don].ref} pct={x.pct} delay={i * 0.09} />)}
        </Card>
      ))}

      {/* Versículo clave */}
      <div style={{ margin: '20px 0', padding: '26px 22px', textAlign: 'center', background: P.panel, border: `1px solid ${P.gold}66`, borderRadius: 12 }}>
        <BookOpen size={20} style={{ color: P.gold, marginBottom: 10 }} />
        <div style={{ fontSize: 10.5, color: P.goldBright, letterSpacing: '0.24em', textTransform: 'uppercase', marginBottom: 12, fontWeight: 700 }}>{t.verse}</div>
        <p style={{ fontFamily: 'Cormorant Garamond, serif', fontStyle: 'italic', fontSize: 21, lineHeight: 1.5, margin: '0 0 8px', color: P.goldBright }}>{verse.v}</p>
        <p style={{ fontSize: 13, color: P.inkDim, margin: 0 }}>— {verse.r}</p>
      </div>

      {personal.corazon && <Card title={t.heart}><p style={{ fontFamily: 'Cormorant Garamond, serif', fontStyle: 'italic', fontSize: 17, lineHeight: 1.62, margin: 0 }}>{personal.corazon}</p></Card>}

      {personal.pasos && personal.pasos.length > 0 && (
        <Card title={t.steps}>
          {personal.pasos.map((p, i) => (
            <div key={i} style={{ display: 'flex', gap: 13, padding: '10px 0', borderBottom: i < personal.pasos.length - 1 ? `1px solid ${P.borderSoft}` : 'none' }}>
              <span style={{ width: 26, height: 26, borderRadius: '50%', flexShrink: 0, background: P.panelSoft, border: `1px solid ${P.gold}`, color: P.goldBright, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 800 }}>{i + 1}</span>
              <p style={{ fontSize: 14, lineHeight: 1.55, margin: '2px 0' }}>{p}</p>
            </div>
          ))}
        </Card>
      )}

      {personal.ciego && (
        <Card title={t.blindspot} icon={AlertTriangle}>
          <p style={{ fontSize: 14, lineHeight: 1.65, margin: 0 }}>{personal.ciego}</p>
        </Card>
      )}

      {/* Sección pastoral */}
      {(pastor.resumen || (pastor.ubicacion || []).length > 0) && (
        <Card title={t.pastorSection} sub={t.pastorSub} icon={Users}>
          {pastor.resumen && <><Sub>{t.execSummary}</Sub><p style={{ fontSize: 14, lineHeight: 1.65, margin: '0 0 16px' }}>{pastor.resumen}</p></>}
          {(pastor.ubicacion || []).length > 0 && (<>
            <Sub>{t.placement}</Sub>
            <ul style={{ margin: '0 0 16px', paddingLeft: 18, fontSize: 13.5, lineHeight: 1.6 }}>
              {pastor.ubicacion.map((u, i) => <li key={i} style={{ marginBottom: 5 }}>{u}</li>)}
            </ul></>)}
          {pastor.equipo && <><Sub>{t.teamNeeds}</Sub><p style={{ fontSize: 13.5, lineHeight: 1.62, margin: '0 0 16px' }}>{pastor.equipo}</p></>}
          {pastor.liderazgo_pastoral && <><Sub>{t.leadership}</Sub><p style={{ fontSize: 13.5, lineHeight: 1.62, margin: '0 0 16px' }}>{pastor.liderazgo_pastoral}</p></>}
          {pastor.madurez_obs && <><Sub>{t.maturity}</Sub><p style={{ fontSize: 13.5, lineHeight: 1.62, margin: '0 0 16px' }}>{pastor.madurez_obs}</p></>}
          {pastor.enfoque_pastoral && <><Sub>{t.calling}</Sub><p style={{ fontSize: 13.5, lineHeight: 1.62, margin: '0 0 16px' }}>{pastor.enfoque_pastoral}</p></>}
          {(pastor.devPlan || []).length > 0 && (<>
            <Sub>{t.devPlan}</Sub>
            <ul style={{ margin: '0 0 16px', paddingLeft: 18, fontSize: 13.5, lineHeight: 1.6 }}>
              {pastor.devPlan.map((d, i) => <li key={i} style={{ marginBottom: 5 }}>{d}</li>)}
            </ul></>)}
          {(pastor.preguntas || []).length > 0 && (<>
            <Sub>{t.pastorQs}</Sub>
            <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, lineHeight: 1.6 }}>
              {pastor.preguntas.map((q, i) => <li key={i} style={{ marginBottom: 5 }}>{q}</li>)}
            </ul></>)}
        </Card>
      )}

      {/* Mapa completo 40 */}
      <Card title={t.fullMap} sub={t.fullMapSub}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 5 }}>
          {tops.all.map((x, i) => (
            <div key={x.don} style={{ display: 'flex', alignItems: 'center', gap: 9, fontSize: 12.5 }}>
              <span style={{ width: 22, color: P.inkFaint, fontSize: 10.5, textAlign: 'right', flexShrink: 0 }}>{i + 1}</span>
              <span style={{ width: 12, fontSize: 9, color: P.gold, flexShrink: 0, fontWeight: 700 }}>{LEX[x.don].ax}</span>
              <span style={{ flex: 1, color: i < 8 ? P.ink : P.inkDim, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{nm(x.don)}</span>
              <span style={{ width: 74, height: 4, background: 'rgba(255,255,255,0.09)', borderRadius: 3, overflow: 'hidden', flexShrink: 0 }}>
                <span style={{ display: 'block', height: '100%', width: `${x.pct}%`, background: i < 8 ? P.gold : `${P.gold}66`, borderRadius: 3 }} />
              </span>
              <span style={{ width: 32, textAlign: 'right', color: i < 8 ? P.goldBright : P.inkFaint, fontSize: 11.5, flexShrink: 0 }}>{x.pct}%</span>
            </div>
          ))}
        </div>
      </Card>

      {personal.epico && (
        <div style={{ margin: '20px 0', padding: '30px 24px', background: `linear-gradient(160deg, ${P.panelSoft}, ${P.panel})`, border: `1px solid ${P.gold}88`, borderRadius: 12, position: 'relative' }}>
          <div style={{ position: 'absolute', top: -10, left: '50%', transform: 'translateX(-50%)', background: P.bg, padding: '0 14px', fontSize: 10.5, color: P.goldBright, letterSpacing: '0.24em', textTransform: 'uppercase', fontWeight: 700, whiteSpace: 'nowrap' }}>✦ {t.epicTitle} ✦</div>
          <p style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 19, lineHeight: 1.72, margin: 0, color: P.ink, textAlign: 'justify' }}>{personal.epico}</p>
        </div>
      )}

      {personal.bendicion && (
        <div style={{ margin: '20px 0', padding: '24px 20px', textAlign: 'center', background: P.panel, border: `1px dashed ${P.gold}77`, borderRadius: 12 }}>
          <div style={{ fontSize: 10.5, color: P.goldBright, letterSpacing: '0.24em', textTransform: 'uppercase', marginBottom: 14, fontWeight: 700 }}>✦ {t.blessing} ✦</div>
          <p style={{ fontFamily: 'Cormorant Garamond, serif', fontStyle: 'italic', fontSize: 18, lineHeight: 1.65, margin: 0, whiteSpace: 'pre-line' }}>{personal.bendicion}</p>
        </div>
      )}

      {earned.length > 0 && (
        <Card title={t.earnedBadges}>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
            {earned.map((b, i) => (
              <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '7px 14px', background: P.panelSoft, border: `1px solid ${P.gold}66`, borderRadius: 999, fontSize: 12.5, color: P.goldBright, animation: `popIn .4s ease ${i * 0.1}s both` }}>
                <Award size={13} /> {b}
              </span>
            ))}
          </div>
        </Card>
      )}

      <p style={{ textAlign: 'center', fontSize: 12, color: P.inkDim, lineHeight: 1.6, padding: '16px 18px', background: P.panel, border: `1px dashed ${P.borderSoft}`, borderRadius: 8, margin: '22px 0' }}>{t.disclaimer}</p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <button onClick={onPdf} style={BP()}><Printer size={17} style={{ marginRight: 8 }} /> {t.pdfBtn}</button>
        <p style={{ fontSize: 11.5, color: P.inkDim, textAlign: 'center', margin: 0 }}>{t.pdfHint}</p>
        <button onClick={onDownload} style={{ ...BG(), justifyContent: 'center' }}><Download size={15} style={{ marginRight: 6 }} /> {t.dlBtn}</button>
        <button onClick={onImage} style={{ ...BG(), justifyContent: 'center', borderColor: `${P.gold}66`, color: P.goldBright }}><Star size={15} style={{ marginRight: 6 }} /> {t.imgBtn}</button>
        <p style={{ fontSize: 11, color: P.inkFaint, textAlign: 'center', margin: '0 0 4px' }}>{t.dlHint}</p>
        <div style={{ display: 'flex', gap: 10 }}>
          <button onClick={onShare} style={{ ...BG(), flex: 1, justifyContent: 'center' }}><Share2 size={15} style={{ marginRight: 6 }} /> {t.shareBtn}</button>
          <button onClick={onRestart} style={{ ...BG(), flex: 1, justifyContent: 'center' }}><RotateCcw size={15} style={{ marginRight: 6 }} /> {t.restart}</button>
        </div>
      </div>
    </div>
  );
}

// GENERADOR DEL DOCUMENTO PDF (2 páginas: certificado + informe pastoral)

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function buildReportHTML({ t, lang, nombre, iglesia, fecha, result, earned, autoPrint = false }) {
  const { tops, personal, pastor, extra } = result;
  const nm = k => LEX[k].n[lang];
  const prim = tops.primC;
  const badge = prim ? BADGES[prim.don][lang] : BADGES.pastorM[lang];
  const verse = prim ? VERSES[prim.don][lang] : VERSES.pastorM[lang];
  const first = (nombre || '').trim().split(' ')[0] || '';

  const rowsOf = (arr, n) => arr.slice(0, n).map(x =>
    `<tr><td class="g">${esc(nm(x.don))}</td><td class="ref">${esc(LEX[x.don].ref)}</td>
     <td class="bar"><span style="width:${x.pct}%"></span></td><td class="pc">${x.pct}%</td></tr>`).join('');

  const detalleHTML = (pastor.detalle || []).map((d, i) => {
    const key = tops.deep[i] ? tops.deep[i].don : null;
    const lx = key ? LEX[key] : null;
    return `<div class="gift">
      <div class="gift-h"><span class="gift-n">${esc(d.don || (key ? nm(key) : ''))}</span>
      <span class="gift-p">${key ? tops.deep[i].pct + '%' : ''}</span></div>
      ${lx ? `<div class="gift-t">${esc(lx.term)} · ${esc(lx.ref)}</div>` : ''}
      <p><b>${esc(t.whatIs)}:</b> ${esc(d.significa || (lx ? lx.d[lang] : ''))}</p>
      <p><b>${esc(t.howLooks)}:</b> ${esc(d.practica || '')}</p>
      <p class="risk"><b>${esc(t.shadow)}:</b> ${esc(d.riesgo || (lx ? lx.s[lang] : ''))}</p>
      <p class="act"><b>${esc(t.activate)}:</b> ${esc(d.activacion || '')}</p>
    </div>`;
  }).join('');

  const listHTML = (arr) => (arr || []).length
    ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';

  const pasosHTML = (personal.pasos || []).map((p, i) =>
    `<li><b>${i + 1}.</b> ${esc(p)}</li>`).join('');

  const mapHTML = tops.all.map((x, i) =>
    `<tr><td class="idx">${i + 1}</td><td class="ax">${LEX[x.don].ax}</td>
     <td class="g2">${esc(nm(x.don))}</td>
     <td class="bar"><span style="width:${x.pct}%"></span></td><td class="pc">${x.pct}%</td></tr>`).join('');

  return `<!DOCTYPE html><html lang="${lang}"><head><meta charset="utf-8">
<title>${esc(t.appName)} — ${esc(nombre)}</title>
<style>
  @page { size: A4; margin: 12mm; }
  * { box-sizing: border-box; }
  body { font-family: Georgia, "Times New Roman", serif; color: #1a1208; margin: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  /* --- Certificado --- */
  .cert { border: 3px double #b8860b; padding: 26px 30px; min-height: 250mm; position: relative; }
  .cert-top { text-align: center; border-bottom: 1px solid #c9a94f; padding-bottom: 14px; margin-bottom: 20px; }
  .brand { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: #8a6a1f; font-weight: 700; }
  .brand2 { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: #a68b3d; margin-top: 3px; }
  h1.ct { font-size: 27px; margin: 8px 0 0; font-weight: 600; }
  .lead { text-align: center; font-size: 12.5px; color: #5a4a20; margin: 0 0 4px; }
  h2.nm { text-align: center; font-size: 33px; margin: 2px 0 4px; font-style: italic; }
  .meta { text-align: center; font-size: 12.5px; color: #5a4a20; margin: 0 0 16px; }
  h3.bg { text-align: center; font-size: 22px; margin: 4px 0 18px; color: #8a6a1f; letter-spacing: .05em; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .blk { margin-bottom: 14px; }
  .blk-h { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #8a6a1f; font-weight: 700; border-bottom: 1px solid #e0cf9a; padding-bottom: 3px; margin-bottom: 5px; }
  td { padding: 3px 5px; vertical-align: middle; }
  td.g { width: 34%; font-weight: 600; }
  td.ref { width: 26%; font-size: 10px; color: #7a6534; font-style: italic; }
  td.bar { width: 28%; }
  td.bar span { display: block; height: 6px; background: #b8860b; border-radius: 3px; }
  td.pc { width: 12%; text-align: right; font-weight: 700; color: #8a6a1f; }

  .verse .vh { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: #8a6a1f; margin-bottom: 5px; }

function Backdrop() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext('2d');
    let raf, W, H;
    const resize = () => { W = c.width = window.innerWidth; H = c.height = window.innerHeight; };
    resize(); window.addEventListener('resize', resize);
    const ps = Array.from({ length: 28 }).map(() => ({
      x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
      r: Math.random() * 1.3 + 0.35, vx: (Math.random() - 0.5) * 0.08,
      vy: -(Math.random() * 0.13 + 0.03), o: Math.random() * 0.1 + 0.03, tw: Math.random() * 6.28,
    }));
    const tick = () => {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.tw += 0.012;
        if (p.y < -6) { p.y = H + 6; p.x = Math.random() * W; }
        if (p.x < -6) p.x = W + 6; if (p.x > W + 6) p.x = -6;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
        ctx.fillStyle = `rgba(212,168,87,${p.o * (0.6 + 0.4 * Math.sin(p.tw))})`; ctx.fill();
      });
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);
  return (
    <>
      <div style={{ position: 'fixed', inset: 0, zIndex: 0, background: `radial-gradient(ellipse at 50% -10%, ${P.purpleDeep}55 0%, transparent 55%), ${P.bg}`, pointerEvents: 'none' }} />
      <canvas ref={ref} style={{ position: 'fixed', inset: 0, zIndex: 1, pointerEvents: 'none' }} />
    </>
  );
}

function Confetti() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext('2d');
    const W = c.width = window.innerWidth, H = c.height = window.innerHeight;
    const cols = ['#d4a857', '#f2cd85', '#6b4ba8', '#f7f1e6'];
    const ps = Array.from({ length: 120 }).map(() => ({
      x: W / 2 + (Math.random() - 0.5) * 150, y: H * 0.2,
      vx: (Math.random() - 0.5) * 9, vy: -(Math.random() * 8 + 3),
      g: 0.22 + Math.random() * 0.1, s: Math.random() * 6 + 3,
      c: cols[Math.floor(Math.random() * cols.length)],
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, life: 1,
    }));
    let raf; const t0 = Date.now();
    const tick = () => {
      const e = (Date.now() - t0) / 1000;
      ctx.clearRect(0, 0, W, H);
      ps.forEach(p => {
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life = Math.max(0, 1 - e / 2.6);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore();
      });
      if (e < 2.8) raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{ position: 'fixed', inset: 0, zIndex: 45, pointerEvents: 'none' }} />;
}
